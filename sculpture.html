<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sculpture</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Controls in a collapsible panel on the right; the 3D stage fills the rest. */
    body {
      background: #000;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #panel {
      flex: none;
      width: 264px;
      box-sizing: border-box;
      padding: 16px;
      overflow-x: hidden;
      overflow-y: auto;
      order: 2; /* after the stage */
      background: #0b0b0b;
      border-left: 1px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: width 180ms ease, padding 180ms ease;
    }

    body.collapsed #panel {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-left: none;
    }

    /* The toggle stays in the top-right corner whether the panel is open or closed. */
    #panel-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2;
      width: 34px;
      height: 34px;
      padding: 0;
      line-height: 1;
      font-size: 16px;
    }

    #panel .top { display: flex; gap: 8px; margin-right: 42px; }
    #panel .top button { flex: 1; }

    #panel h2 {
      margin: 10px 0 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Each setting is a row: its name, then its control filling the rest. */
    #panel label {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    #panel label.check { display: flex; }
    #panel label[hidden], #panel .buttons[hidden] { display: none; }
    #panel select, #panel input[type='range'] { width: 100%; min-width: 0; box-sizing: border-box; }
    #panel input { accent-color: var(--accent); }
    #panel .buttons { display: flex; gap: 8px; }
    #panel .buttons button { flex: 1; }
    #panel a { color: var(--muted); margin-top: auto; padding-top: 12px; }
    #unsupported { margin: 0; white-space: normal; }

    #stage {
      flex: 1;
      min-width: 0;
      position: relative;
      cursor: grab;
      touch-action: none;
    }

    #stage:active { cursor: grabbing; }
    #stage canvas { display: block; }

    /* On narrow screens the panel floats over the sculpture instead of squeezing it. */
    @media (max-width: 720px) {
      #panel { position: absolute; z-index: 1; top: 0; bottom: 0; right: 0; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="panel-toggle" aria-controls="panel" aria-expanded="true" title="Hide settings" aria-label="Hide settings">›</button>

  <aside id="panel" aria-label="Settings">
    <div class="top"><button id="connect">Connect</button></div>
    <p id="unsupported" hidden>
      Web Bluetooth isn't available here. Use Chrome or Edge, and serve this page from
      <code>localhost</code> or HTTPS.
    </p>

    <h2>Signal</h2>
    <label id="scale-control">
      Scale
      <select id="scale">
        <option value="50" selected>±50 µV</option>
        <option value="100">±100 µV</option>
        <option value="200">±200 µV</option>
        <option value="500">±500 µV</option>
      </select>
    </label>
    <label id="trail-control">
      Trail
      <select id="trail">
        <option value="0.5">0.5 s</option>
        <option value="1">1 s</option>
        <option value="2" selected>2 s</option>
        <option value="4">4 s</option>
        <option value="8">8 s</option>
      </select>
    </label>
    <!-- The alpha curves move over seconds, so their trails are much longer. -->
    <label id="slow-trail-control" hidden>
      Trail
      <select id="slow-trail">
        <option value="5">5 s</option>
        <option value="10">10 s</option>
        <option value="15">15 s</option>
        <option value="30">30 s</option>
        <option value="60" selected>1 min</option>
        <option value="120">2 min</option>
        <option value="300">5 min</option>
      </select>
    </label>
    <label id="curve-control">
      Curve
      <select id="curve">
        <option value="xyx">x, y, x delayed</option>
        <option value="xyy">x, y, y delayed</option>
        <option value="diff">Takens of x − y</option>
        <option value="sum">Takens of x + y</option>
        <option value="alphaPeak">Alpha: power, asymmetry, peak frequency</option>
        <option value="alphaHemi">Alpha per hemisphere: back, front, peak frequency</option>
        <option value="harmonograph">Harmonograph: band powers as pendulums</option>
      </select>
    </label>
    <!-- Each band's delay is a quarter period of its typical frequency. -->
    <label id="delay-control">
      Delay
      <select id="delay">
        <option value="auto" selected>Auto</option>
        <option value="2">Delta, 2 Hz (125 ms)</option>
        <option value="6">Theta, 6 Hz (42 ms)</option>
        <option value="10">Alpha, 10 Hz (25 ms)</option>
        <option value="20">Beta, 20 Hz (12.5 ms)</option>
        <option value="40">Gamma, 40 Hz (6.25 ms)</option>
      </select>
    </label>
    <label id="side-control">
      Side
      <select id="side">
        <option value="both">Both</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </label>

    <h2>Form</h2>
    <label>
      Form
      <select id="form">
        <option value="tube">Tube</option>
        <option value="hemispheres">Surface b/w hemispheres</option>
        <option value="blobs">Metaballs</option>
        <option value="recurrence">Recurrence threads</option>
        <option value="density">Long exposure</option>
        <option value="vessel">Spectral vessel</option>
        <option value="grown">Grown shell</option>
      </select>
    </label>
    <!-- Long exposure: how long a pass lingers, and how dense a region must be to show. -->
    <label id="exposure-control" hidden>
      Exposure
      <select id="exposure">
        <option value="10">10 s</option>
        <option value="30">30 s</option>
        <option value="60" selected>1 min</option>
        <option value="180">3 min</option>
        <option value="600">10 min</option>
      </select>
    </label>
    <label id="level-control" hidden>
      Level
      <input type="range" id="level" min="0.03" max="0.6" step="0.01" value="0.15">
    </label>
    <div id="clear-control" class="buttons" hidden>
      <button id="clear-density">Clear exposure</button>
    </div>
    <!-- Spectral vessel: how far the wall bulges with each frequency's power. -->
    <label id="relief-control" hidden>
      Relief
      <input type="range" id="relief" min="0" max="0.4" step="0.01" value="0.08">
    </label>
    <!-- Grown shell: the kind of shell, and how much each whorl widens. -->
    <label id="shape-control" hidden>
      Shape
      <select id="shell-shape">
        <option value="nautilus">Nautilus</option>
        <option value="auger">Auger</option>
        <option value="conch">Conch</option>
      </select>
    </label>
    <label id="expansion-control" hidden>
      Flare
      <input type="range" id="expansion" min="1.3" max="4" step="0.05" value="2.2">
    </label>
    <label id="thickness-control">
      Thickness
      <select id="thickness">
        <option value="0">None</option>
        <option value="0.02">Thin</option>
        <option value="0.04" selected>Medium</option>
        <option value="0.07">Thick</option>
      </select>
    </label>
    <!-- Live controls: each shows only for its form. -->
    <label id="ball-control" hidden>
      Ball size
      <input type="range" id="ball-size" min="0.04" max="0.4" step="0.01" value="0.15">
    </label>
    <!-- How far each ball's field reaches, in ball radii: beads (low) to liquid (high). -->
    <label id="blend-control" hidden>
      Blend
      <input type="range" id="blend" min="1.3" max="3" step="0.05" value="1.9">
    </label>
    <!-- Distance between balls along the curve, in ball radii: smooth (low) to beaded (high). -->
    <label id="spacing-control" hidden>
      Spacing
      <input type="range" id="spacing" min="0.2" max="3" step="0.05" value="0.75">
    </label>
    <!-- How finely the metaball surface is sampled: faceted (low) to smooth (high). -->
    <label id="grid-control" hidden>
      Grid
      <select id="grid">
        <option value="24">24</option>
        <option value="32">32</option>
        <option value="40" selected>40</option>
        <option value="56">56</option>
        <option value="72">72</option>
      </select>
    </label>
    <label id="closeness-control" hidden>
      Closeness
      <input type="range" id="closeness" min="0.02" max="0.3" step="0.01" value="0.12">
    </label>

    <h2>Look</h2>
    <label>
      Material
      <select id="material">
        <option value="marble">Marble</option>
        <option value="bronze">Bronze</option>
        <option value="whiteBronze">White bronze</option>
        <option value="chrome">Chrome</option>
        <option value="concrete">Concrete</option>
        <option value="stone">White stone</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="rotate" checked> Rotate</label>
    <label class="check"><input type="checkbox" id="freeze"> Freeze</label>

<h2>Save</h2>
    <div class="buttons">
      <button id="save-glb">Save .glb</button>
      <button id="save-stl">Save .stl</button>
    </div>

    <a href="bineural.html">Bineural</a>
  </aside>

  <div id="stage" role="img" aria-label="The EEG trace as a 3D sculpture"></div>

  <script type="module" src="sculpture.js"></script>
</body>
</html>
