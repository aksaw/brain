<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bineural</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Controls in a collapsible panel on the right, as on the Sculpture page; the plots fill
       the rest, centred both ways. */
    body {
      background: #000;
      display: flex;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #panel {
      flex: none;
      width: 264px;
      box-sizing: border-box;
      padding: 16px;
      overflow-x: hidden;
      overflow-y: auto;
      order: 2; /* after the plots */
      background: #0b0b0b;
      border-left: 1px solid #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: width 180ms ease, padding 180ms ease;
    }

    body.collapsed #panel {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-left: none;
    }

    /* The toggle stays in the top-right corner whether the panel is open or closed. */
    #panel-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2;
      width: 34px;
      height: 34px;
      padding: 0;
      line-height: 1;
      font-size: 16px;
    }

    #panel .top { display: flex; gap: 8px; margin-right: 42px; }
    #panel .top button { flex: 1; }

    #panel h2 {
      margin: 10px 0 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Each setting is a row: its name, then its control filling the rest. */
    #panel label {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    #panel label.check { display: flex; flex-wrap: wrap; column-gap: 6px; row-gap: 2px; white-space: normal; }
    #panel label[hidden] { display: none; }
    #panel select, #panel input[type='range'] { width: 100%; min-width: 0; box-sizing: border-box; }
    #panel input { accent-color: var(--accent); }
    #panel a { color: var(--muted); margin-top: auto; padding-top: 12px; }
    #unsupported { margin: 0; white-space: normal; }
    #bpm { color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Plots are sized from the space beside the panel (container units), so they grow when
       it's hidden: two side by side, or the overlay alone, as large as fits. */
    .xy {
      flex: 1;
      min-width: 0;
      container-type: size;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      align-items: center;
      gap: 24px;
    }

    .xy figure {
      margin: 0;
      width: min(calc(50cqw - 36px), calc(100cqh - 48px));
    }

    .xy figure[hidden] { display: none; }
    .xy.draggable { cursor: grab; touch-action: none; }
    .xy.dragging { cursor: grabbing; }

    .xy #overlay-figure { width: min(calc(100cqw - 48px), calc(100cqh - 48px)); }

    .xy canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: #000;
    }

    /* On narrow screens the panel floats over the plots, which stack. */
    @media (max-width: 720px) {
      #panel { position: absolute; z-index: 1; top: 0; bottom: 0; right: 0; }
      .xy figure { width: min(calc(100cqw - 32px), calc(50cqh - 36px)); }
    }
  </style>
</head>
<body>
  <button id="panel-toggle" aria-controls="panel" aria-expanded="true" title="Hide settings" aria-label="Hide settings">›</button>

  <aside id="panel" aria-label="Settings">
    <div class="top"><button id="connect">Connect</button></div>
    <p id="unsupported" hidden>
      Web Bluetooth isn't available here. Use Chrome or Edge, and serve this page from
      <code>localhost</code> or HTTPS.
    </p>

    <h2>Plot</h2>
    <label>
      Scale
      <select id="scale">
        <option value="50" selected>±50 µV</option>
        <option value="100">±100 µV</option>
        <option value="200">±200 µV</option>
        <option value="500">±500 µV</option>
      </select>
    </label>
    <label>
      Trail
      <select id="trail">
        <option value="0.25">0.25 s</option>
        <option value="0.5">0.5 s</option>
        <option value="1" selected>1 s</option>
        <option value="2">2 s</option>
      </select>
    </label>
    <label>
      View
      <select id="view">
        <option value="2d">2D</option>
        <option value="delay">3D: x, y, x delayed</option>
        <option value="delayY">3D: x, y, y delayed</option>
        <option value="takens">3D: Takens embedding of x − y</option>
        <option value="takensSum">3D: Takens embedding of x + y</option>
        <option value="pca">3D PCA</option>
      </select>
    </label>
    <!-- Each band's delay is a quarter period of its typical frequency. -->
    <label id="delay-control" hidden>
      Delay
      <select id="delay">
        <option value="auto" selected>Auto</option>
        <option value="2">Delta, 2 Hz (125 ms)</option>
        <option value="6">Theta, 6 Hz (42 ms)</option>
        <option value="10">Alpha, 10 Hz (25 ms)</option>
        <option value="20">Beta, 20 Hz (12.5 ms)</option>
        <option value="40">Gamma, 40 Hz (6.25 ms)</option>
      </select>
    </label>
    <label id="motion-control" hidden>
      Motion
      <select id="motion">
        <option value="spin">Auto-rotate</option>
        <option value="mouse">Mouse</option>
        <option value="head">Head</option>
      </select>
    </label>
    <label id="overlay-control" class="check"><input type="checkbox" id="overlay"> Overlay</label>

    <h2>Sound</h2>
    <label>
      Sound
      <select id="sound">
        <option value="off">Off</option>
        <option value="drone">Drone (trail shape)</option>
        <option value="plucks">Plucks (big swings)</option>
        <option value="granular">Granular</option>
        <option value="layers">Layered shift</option>
        <option value="spectral">Spectral map</option>
      </select>
    </label>
    <label id="speed-control" hidden>
      Speed
      <select id="speed">
        <option value="25">×25</option>
        <option value="50" selected>×50</option>
        <option value="100">×100</option>
      </select>
    </label>
    <label id="crush-control" class="check" hidden><input type="checkbox" id="crush"> Bitcrush</label>
    <label id="range-control" hidden>
      Range
      <select id="range">
        <option value="1760">55 Hz – 1.8 kHz</option>
        <option value="3520">55 Hz – 3.5 kHz</option>
        <option value="7040" selected>55 Hz – 7 kHz</option>
      </select>
    </label>
    <!-- The plucks' shell: smaller means the trace reaches it, and strikes, more often. -->
    <label id="sphere-control" hidden>
      Sphere size
      <input type="range" id="sphere" min="0.15" max="0.95" step="0.01" value="0.5">
    </label>
    <!-- A soft bass thump on every heartbeat seen by the headband's heart sensor (PPG). -->
    <label id="thump-control" class="check" hidden>
      <input type="checkbox" id="thump"> Heartbeat thump <span id="bpm"></span>
    </label>
    <label>
      Volume
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </label>
    <label>
      Reverb
      <input type="range" id="reverb" min="0" max="2" step="0.01" value="0.3">
    </label>

    <a href="dashboard.html">Dashboard</a>
  </aside>

  <main class="xy">
    <figure class="split">
      <canvas id="left-plot" role="img" aria-label="Left hemisphere: AF7 (x) against TP9 (y)"></canvas>
    </figure>
    <figure class="split">
      <canvas id="right-plot" role="img" aria-label="Right hemisphere: AF8 (x) against TP10 (y)"></canvas>
    </figure>
    <figure id="overlay-figure" hidden>
      <canvas id="overlay-plot" role="img"
              aria-label="Both hemispheres overlaid: AF7 against TP9 and AF8 against TP10"></canvas>
    </figure>
  </main>

  <script type="module" src="bineural.js"></script>
</body>
</html>
