<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bineural</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* The plots fill the space below the header, centred both ways. */
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .xy {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      align-items: center;
      gap: 24px;
    }

    .xy figure {
      margin: 0;
      width: min(100%, 46vw, 72vh);
    }

    .xy figure[hidden] { display: none; }
    .xy.draggable { cursor: grab; touch-action: none; }
    .xy.dragging { cursor: grabbing; }

    /* The overlay holds both hemispheres in one, larger plot. */
    .xy #overlay-figure { width: min(100%, 92vw, 80vh); }

    .xy canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: #000;
    }

    header a { color: var(--muted); margin-left: auto; }
    header label[hidden] { display: none; }
    #volume, #reverb { accent-color: var(--accent); vertical-align: middle; }

    @media (max-width: 720px) {
      .xy figure { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <button id="connect">Connect</button>
    <label>
      Scale
      <select id="scale">
        <option value="50" selected>±50 µV</option>
        <option value="100">±100 µV</option>
        <option value="200">±200 µV</option>
        <option value="500">±500 µV</option>
      </select>
    </label>
    <label>
      Trail
      <select id="trail">
        <option value="0.25">0.25 s</option>
        <option value="0.5">0.5 s</option>
        <option value="1" selected>1 s</option>
        <option value="2">2 s</option>
      </select>
    </label>
    <label>
      View
      <select id="view">
        <option value="2d">2D</option>
        <option value="delay">3D: x, y, x delayed</option>
        <option value="delayY">3D: x, y, y delayed</option>
        <option value="takens">3D: Takens embedding of x − y</option>
        <option value="takensSum">3D: Takens embedding of x + y</option>
        <option value="pca">3D PCA</option>
      </select>
    </label>
    <!-- Each band's delay is a quarter period of its typical frequency. -->
    <label id="delay-control" hidden>
      Delay
      <select id="delay">
        <option value="auto" selected>Auto</option>
        <option value="2">Delta, 2 Hz (125 ms)</option>
        <option value="6">Theta, 6 Hz (42 ms)</option>
        <option value="10">Alpha, 10 Hz (25 ms)</option>
        <option value="20">Beta, 20 Hz (12.5 ms)</option>
        <option value="40">Gamma, 40 Hz (6.25 ms)</option>
      </select>
    </label>
    <label id="motion-control" hidden>
      Motion
      <select id="motion">
        <option value="spin">Auto-rotate</option>
        <option value="mouse">Mouse</option>
        <option value="head">Head</option>
      </select>
    </label>
    <label id="overlay-control"><input type="checkbox" id="overlay"> Overlay</label>
    <label>
      Sound
      <select id="sound">
        <option value="off">Off</option>
        <option value="granular">Granular</option>
        <option value="layers">Layered shift</option>
        <option value="spectral">Spectral map</option>
      </select>
    </label>
    <label id="speed-control" hidden>
      Speed
      <select id="speed">
        <option value="25">×25</option>
        <option value="50" selected>×50</option>
        <option value="100">×100</option>
      </select>
    </label>
    <label id="crush-control" hidden><input type="checkbox" id="crush"> Bitcrush</label>
    <label id="range-control" hidden>
      Range
      <select id="range">
        <option value="1760">55 Hz – 1.8 kHz</option>
        <option value="3520">55 Hz – 3.5 kHz</option>
        <option value="7040" selected>55 Hz – 7 kHz</option>
      </select>
    </label>
    <label>
      Volume
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </label>
    <label>
      Reverb
      <input type="range" id="reverb" min="0" max="1" step="0.01" value="0.3">
    </label>
    <a href="dashboard.html">Dashboard</a>
  </header>

  <p id="unsupported" hidden>
    Web Bluetooth isn't available here. Use Chrome or Edge, and serve this page from
    <code>localhost</code> or HTTPS.
  </p>

  <main class="xy">
    <figure class="split">
      <canvas id="left-plot" role="img" aria-label="Left hemisphere: AF7 (x) against TP9 (y)"></canvas>
    </figure>
    <figure class="split">
      <canvas id="right-plot" role="img" aria-label="Right hemisphere: AF8 (x) against TP10 (y)"></canvas>
    </figure>
    <figure id="overlay-figure" hidden>
      <canvas id="overlay-plot" role="img"
              aria-label="Both hemispheres overlaid: AF7 against TP9 and AF8 against TP10"></canvas>
    </figure>
  </main>

  <script type="module" src="bineural.js"></script>
</body>
</html>
